workflows:
  integrago-ios-testflight:
    name: IntegraGo iOS TestFlight
    instance_type: mac_mini_m2
    working_directory: IntegraGO_App
    integrations:
      app_store_connect: CodeMagic
    environment:
      node: "24"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: mx.grupocge.integrago
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Preparar recursos para Capacitor
        script: npm run build
      - name: Sincronizar el proyecto iOS
        script: npm run cap -- sync ios
      - name: Aplicar firma de distribucion
        script: xcode-project use-profiles
      - name: Generar IPA
        script: |
          set -e
          ipa_dir="$PWD/build/ios/ipa"
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "CURRENT_PROJECT_VERSION=${BUILD_NUMBER:?}" \
            --ipa-directory "$ipa_dir"
          if ! compgen -G "$ipa_dir/*.ipa" > /dev/null; then
            echo "No se encontro el IPA exportado en $ipa_dir" >&2
            exit 1
          fi
          ls -lh "$ipa_dir"/*.ipa
    artifacts:
      - IntegraGO_App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
